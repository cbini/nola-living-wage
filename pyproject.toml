[project]
name = "nola-lw"
version = "0.1.0"
description = "Orleans Parish living-wage gap and capacity analysis (place of work)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "polars",
    "duckdb",
    "pyyaml",
    "fastexcel>=0.21.0",
    "matplotlib>=3.11.2",
]

[project.scripts]
nola-lw = "nola_lw.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nola_lw"]
