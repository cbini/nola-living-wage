# All constants for the pipeline (SPEC §9: no numbers in code).
years:
  pool: [2020, 2024]     # headline, published 5-year pool
  subset: [2022, 2024]   # shown alongside (SPEC §6, §12f)

# Orleans codes; POWPUMA confirmed at the §11.2 checkpoint
orleans:
  state_fips: "22"
  county_fips: "071"
  powsp: "022"
  powpuma: ["02400"]
  residence_pumas: ["02401", "02402", "02403"]

mit:
  base_url: "https://livingwage.mit.edu"
  county_path: "counties/22071"
  metro_path: "metros/35380"
  methodology_path: "pages/methodology"
  floor_type: "a1_w1_c0"
  hours_full_time: 2080

cpi:
  series: "CUUR0300SA0"   # CPI-U South urban, NSA
  base_year: 2024         # ADJINC dollar year
  target: "2025-12"       # MIT price basis (SPEC §4)
  fetch_years: [2019, 2026]

pums:
  bulk_base: "https://www2.census.gov/programs-surveys/acs/data/pums/2024/5-Year"
  bulk_states: ["la", "ms"]
  bulk_state_fips: {la: "22", ms: "28"}
  # 48 states + DC + Puerto Rico, excluding LA and MS
  other_states: [ak, al, ar, az, ca, co, ct, dc, de, fl, ga, hi, ia, id, il, in, ks, ky,
                 ma, md, me, mi, mn, mo, mt, nc, nd, ne, nh, nj, nm, nv, ny, oh, ok, or,
                 pa, pr, ri, sc, sd, tn, tx, ut, va, vt, wa, wi, wv, wy]
  dictionary_url: "https://www2.census.gov/programs-surveys/acs/tech_docs/pums/data_dict/PUMS_Data_Dictionary_2020-2024.csv"
  min_free_disk_gb: 5
  tract_to_puma_url: "https://www2.census.gov/geo/docs/maps-data/data/rel2020/2020_Census_Tract_to_2020_PUMA.txt"
  # IPUMS USA county-to-POWPUMA lookup (2022; 2020 Census POWPUMA definitions) — compiled by IPUMS from Census Bureau geography, not a Census Bureau publication
  powpuma_composition_url: "https://usa.ipums.org/usa/resources/volii/county_migpuma_pwpuma_2022.xls"

bea:
  county_geo: "22071"
  state_geo: "22000"
  county_tables: [CAGDP2, CAINC5N, CAINC6N, CAINC1]
  state_tables: [SAGDP2, SAGDP3, SAGDP4, SAGDP7, SAINC1, SAPCE1]
  zip_base: "https://apps.bea.gov/regional/zip"
  zips: [CAGDP2, CAINC5N, CAINC6N, CAINC1, SAGDP, SAINC, SAPCE]
  wages_line: {table: CAINC5N, line: "50"}
  wages_crosscheck: {table: CAINC6N, line: "5"}
  gdp_total_line: {table: CAGDP2, line: "1"}
  # CAGDP2 top-level sectors (these sum to line 1 when nothing is suppressed)
  gdp_sector_lines: ["3", "6", "10", "11", "12", "34", "35", "36", "45", "50", "59", "68", "75", "82", "83"]
  state_abbr: "LA"          # per-state CSV inside each ZIP carries the county and state rows
  national_geo: "00000"
  national_abbr: "US"
  suppression_flags: ["(D)", "(NA)", "(NM)", "(L)"]
  api_base: "https://apps.bea.gov/api/data"
  api_min_interval_s: 1
  fixed_assets:
    dataset: FixedAssets
    table: FAAt304ESI
  unit_scale:               # file Unit column -> multiplier to dollars (or 1 for non-dollar units)
    "Thousands of dollars": 1000
    "Millions of current dollars": 1000000
    "Millions of dollars": 1000000
    "Dollars": 1
    "Number of persons": 1

households:
  max_children: 3
  adult_age: 18           # under this age = a child in the MIT family unit (Decision 1)

universe:
  cow_wage: ["1", "2", "3", "4", "5"]
  cow_public: ["3", "4", "5"]
  cow_self: ["6", "7"]
  cow_unpaid: ["8"]
  cow_class: {"1": private, "2": nonprofit, "3": public, "4": public, "5": public}
  wage_min: 2
  wage_max: 500

capacity:
  gos_validation_tol_usd: 500000
  total_line: "1"
  private_line: "2"
  cainc6n_total: ["1"]
  cainc6n_private: ["81", "90"]
  # CAGDP2 real estate: its GOS includes imputed rent on owner-occupied housing (no employer pays wages from it);
  # table 3 and the headline also show the GOS tests with this line's gap and GOS removed
  imputed_rent_line: "56"
  # employer Social Security (6.2%) + Medicare (1.45%): a raise costs the employer this much more than the raise.
  # Loads the gap in every comparison with GDP, compensation or GOS (all include it), and the pass-through;
  # not the comparison with wages (which exclude it) or the worker gaps themselves
  employer_payroll_tax_rate: 0.0765

crosswalk:
  gov_line: "83"
  prefix_to_line: {"11": "3", "21": "6", "22": "10", "23": "11", "31": "12", "32": "12", "33": "12", "3M": "12",
                    "42": "34", "44": "35", "45": "35", "4M": "35", "48": "36", "49": "36", "51": "45", "52": "51",
                    "53": "56", "54": "60", "55": "64", "56": "65", "61": "69", "62": "70", "71": "76", "72": "79",
                    "81": "82"}

# SPEC §12 decisions a–f
decisions:
  household_unit: family_with_subfamilies        # a
  thresholds: orleans                            # b
  sensitivity_thresholds: metro                  # b
  gos_test: both                                 # c
  out_of_state: all_state_bulk                   # d
  passthrough_bases: [resident_pce, gdp]         # e
  passthrough_p: [0, 0.5, 1]                     # §7.1
  headline_years: pool                           # f
  alongside_years: subset                        # f

sensitivity:
  passthrough_tol: 1.0e-6
  passthrough_max_iter: 100

checkpoint:
  wage_tolerance: 0.15
  # BEA counts salaries owners of incorporated businesses pay themselves (COW 7) as wages;
  # the like-for-like check adds them. The living-wage analysis still uses universe.cow_wage.
  wage_check_cow_bea: ["1", "2", "3", "4", "5", "7"]
moe_z: 1.645

report:
  # SPEC §6 names hospitality as the likely self-funding failure; the headline states its result either way
  spec_expected_fail: ["79"]
  # Line-specific caveats appended to the negative-GOS footnote (text only; numbers are computed)
  line_notes: {}
  hist_bin_usd: 1          # wage histogram bin width, $/hr
  hist_max_quantile: 0.95  # wage histogram x-axis cut (weighted quantile)

# Employer-reported pay cross-check: BLS Occupational Employment and Wage Statistics (OEWS)
oews:
  area: "0035380"               # New Orleans-Metairie MSA (CBSA 35380), BLS OEWS area code
  year: 2025
  reference_month: "2025-05"    # OEWS estimates are for May of the survey year
  datatypes: {employment: "01", p10: "06", p25: "07", p50: "08", p75: "09", p90: "10"}
  # CBSA 35380 parishes: Jefferson, Orleans, Plaquemines, St. Bernard, St. Charles, St. James, St. John, St. Tammany
  metro_counties: ["051", "071", "075", "087", "089", "093", "095", "103"]
